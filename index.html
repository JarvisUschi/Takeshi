<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start</title>
<style>
:root{color-scheme:dark}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#101418;color:#e8eef2;font:22px/1.4 system-ui,sans-serif}
main{text-align:center;padding:24px;max-width:640px}h1{font-size:34px;margin:0 0 18px}
input{font-size:40px;letter-spacing:.25em;text-align:center;width:9ch;padding:12px 16px;border-radius:12px;border:3px solid #3a4a55;background:#1b232a;color:#fff}
input:focus{outline:none;border-color:#7fd17f}
button{font-size:28px;margin-top:22px;padding:12px 36px;border-radius:12px;border:3px solid #3a4a55;background:#24303a;color:#fff}
button:focus{outline:none;border-color:#7fd17f;background:#2f4a2f}#m{min-height:1.5em;margin-top:18px;color:#f0b070}
</style></head><body><main>
<h1>Code eingeben</h1>
<input id="c" inputmode="numeric" autocomplete="off" maxlength="12" autofocus>
<br><button id="b">Weiter</button><div id="m"></div>
</main>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function los(){
  const m=document.getElementById('m'), code=document.getElementById('c').value.replace(/\D/g,'');
  if(!code){m.textContent='Bitte den Code eingeben.';return}
  m.textContent='Einen Moment …';
  try{
    const d=await (await fetch('daten.json?'+Date.now(),{cache:'no-store'})).json();
    const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(d.s),iterations:d.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
    const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(d.i)},k,b64(d.c));
    const z=JSON.parse(new TextDecoder().decode(t));
    m.textContent='Download startet …'; location.href=z.u;
  }catch(e){m.textContent='Der Code stimmt nicht oder ist abgelaufen.'}
}
document.getElementById('b').onclick=los;
document.getElementById('c').addEventListener('keydown',e=>{if(e.key==='Enter')los()});
</script></body></html>
